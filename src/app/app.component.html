<!-- Vista de Autenticación si el usuario no ha iniciado sesión -->
<div *ngIf="!(authService.usuario$ | async)">
  <app-login></app-login>
</div>

<!-- Panel de Control Principal Protegido con Barra Vertical -->
<div class="container-fluid" *ngIf="authService.usuario$ | async as user">
  <div class="row">
    <!-- Sidebar Vertical Responsivo -->
    <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse text-white min-vh-100 p-3">
      <div class="position-sticky">
        <h5 class="text-center py-2 border-bottom border-secondary text-truncate">Bienvenido</h5>
        <div class="p-2 mb-3 bg-secondary bg-opacity-25 rounded text-center small">
          <span class="d-block fw-bold text-warning">{{ user.username }}</span>
          <span class="badge bg-light text-dark mt-1">{{ user.rol }}</span>
        </div>

        <ul class="nav flex-column gap-2">
          <li class="nav-item">
            <button class="btn btn-dark w-100 text-start" [class.btn-primary]="activeModule === 1" (click)="activeModule = 1">
              <i class="bi bi-building me-2"></i> 1. Equipamientos
            </button>
          </li>
          <li class="nav-item">
            <button class="btn btn-dark w-100 text-start" [class.btn-primary]="activeModule === 2" (click)="activeModule = 2">
              <i class="bi bi-journal-check me-2"></i> 2. Ocupación y Uso
            </button>
          </li>
          <li class="nav-item">
            <button class="btn btn-dark w-100 text-start" [class.btn-primary]="activeModule === 3" (click)="activeModule = 3">
              <i class="bi bi-calendar3 me-2"></i> 3. Calendario
            </button>
          </li>
        </ul>

        <div class="mt-5 pt-5 border-top border-secondary">
          <button class="btn btn-outline-danger btn-sm w-100" (click)="logout()">
            <i class="bi bi-box-arrow-left me-1"></i> Cerrar Sesión
          </button>
        </div>
      </div>
    </nav>

    <!-- Inyección Dinámica del Componente según el Módulo Activo -->
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4 bg-light min-vh-100">
      <app-equipamientos *ngIf="activeModule === 1"></app-equipamientos>
      <app-ocupacion *ngIf="activeModule === 2"></app-ocupacion>
      
      <!-- Invocación correcta al selector del módulo del calendario -->
      <app-calendario-sesiones *ngIf="activeModule === 3"></app-calendario-sesiones>
    </main>
  </div>
</div>
