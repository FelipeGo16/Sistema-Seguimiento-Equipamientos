<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-lg p-4 border-0" style="max-width: 400px; width: 100%">
    <div class="text-center mb-4">
      <h3 class="fw-bold text-primary">Sistema de Seguimiento</h3>
      <p class="text-muted small">Ingreso al Panel Técnico Control de Equipamientos</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Campo Usuario -->
      <div class="mb-3">
        <label class="form-label fw-bold small">Usuario / Funcionario</label>
        <input
          type="text"
          class="form-control"
          formControlName="usuario"
          placeholder="Ej: Juan Pérez"
        />
      </div>

      <!-- Selector de Rol con los 3 perfiles requeridos -->
      <div class="mb-4">
        <label class="form-label fw-bold small">Rol Asignado</label>
        <select class="form-select text-capitalize" formControlName="rol">
          <option *ngFor="let r of rolesDisponibles" [value]="r">
            {{ r }}
          </option>
        </select>
      </div>

      <!-- Botón de Envío -->
      <button
        type="submit"
        class="btn btn-primary w-100 py-2 fw-bold"
        [disabled]="!loginForm.valid"
      >
        Iniciar Sesión
      </button>
    </form>
  </div>
</div>
