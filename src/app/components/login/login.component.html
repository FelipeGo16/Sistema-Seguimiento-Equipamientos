<div class="container d-flex justify-content-center align-items-center min-vh-100 bg-light">
  <div class="card shadow-sm border-0" style="width: 400px">
    <div class="card-header bg-dark text-white text-center py-3">
      <h4 class="m-0 fw-normal">Sistema de Seguimiento</h4>
      <small class="text-white-50">Control de Equipamientos y Sesiones</small>
    </div>

    <div class="card-body p-4 bg-white">
      <!-- Alerta de error si fallan las credenciales -->
      <div *ngIf="errorMsg" class="alert alert-danger py-2 small text-center">
        {{ errorMsg }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary">Correo Electrónico</label>
          <input
            type="email"
            formControlName="correo"
            class="form-control"
            placeholder="ejemplo@entidad.gov.co"
          />
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold text-secondary">Contraseña</label>
          <input
            type="password"
            formControlName="password"
            class="form-control"
            placeholder="••••••••"
          />
        </div>

        <button
          type="submit"
          [disabled]="loginForm.invalid || cargando"
          class="btn btn-primary w-100 py-2 fw-bold"
        >
          {{ cargando ? 'Verificando...' : 'Iniciar Sesión' }}
        </button>
      </form>
    </div>

    <div class="card-footer bg-white text-center border-0 pb-3">
      <small class="text-muted">Acceso inicial: admin@sistema.com / admin123</small>
    </div>
  </div>
</div>
