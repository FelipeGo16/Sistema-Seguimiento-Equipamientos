<div class="row">
  <!-- COLUMNA IZQUIERDA: NIVEL CURSO -->
  <div class="col-lg-5 mb-4">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-success text-white py-3">
        <h5 class="mb-0 fw-bold"><i class="bi bi-journal-bookmark me-2"></i>Nivel: Curso</h5>
      </div>
      <div class="card-body">
        <form [formGroup]="cursoForm" (ngSubmit)="saveCurso()">
          <!-- ID del curso -->
          <div class="mb-3">
            <label class="form-label fw-bold small text-muted">ID del curso</label>
            <input
              type="text"
              class="form-control bg-light fw-bold text-primary"
              formControlName="idCurso"
              readonly
            />
          </div>

          <!-- Nombre del curso -->
          <div class="mb-3">
            <label class="form-label fw-bold small text-muted">Nombre del curso</label>
            <input
              type="text"
              class="form-control"
              formControlName="nombreCurso"
              placeholder="Ej: Curso de Confección Básica"
            />
          </div>

          <!-- Componente de servicio -->
          <div class="mb-3">
            <label class="form-label fw-bold small text-muted">Componente de servicio</label>
            <select class="form-select" formControlName="componenteServicio">
              <option value="">Seleccione un componente...</option>
              <option *ngFor="let comp of componentesServicioList" [value]="comp">
                {{ comp }}
              </option>
            </select>
          </div>

          <!-- Cantidad de Sesiones -->
          <div class="mb-3">
            <label class="form-label fw-bold small text-muted"
              >Cantidad de Sesiones a Programar</label
            >
            <select class="form-select bg-light border-primary" formControlName="cantidadSesiones">
              <option value="">Seleccione número de sesiones...</option>
              <option *ngFor="let num of listaSesionesMax" [value]="num">
                {{ num }} Sesión(es)
              </option>
            </select>
          </div>

          <!-- Rango de Fechas -->
          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label fw-bold small text-muted">Fecha inicio</label>
              <input type="date" class="form-control" formControlName="fechaInicio" />
            </div>
            <div class="col-6">
              <label class="form-label fw-bold small text-muted">Fecha fin</label>
              <input type="date" class="form-control" formControlName="fechaFin" />
            </div>
          </div>

          <!-- Asistentes -->
          <div class="mb-4">
            <label class="form-label fw-bold small text-muted">Asistentes</label>
            <input
              type="number"
              class="form-control"
              formControlName="asistentes"
              placeholder="Mínimo 1"
            />
          </div>

          <button
            type="submit"
            *ngIf="authService.puedeEditar()"
            class="btn btn-success w-100 py-2 fw-bold"
            [disabled]="!cursoForm.valid"
          >
            Guardar Curso Completo
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- COLUMNA DERECHA: LISTADO DE SESIONES COMPLETAMENTE DESPLEGADAS -->
  <div class="col-lg-7 mb-4" [formGroup]="cursoForm">
    <div class="card shadow-sm border-0" *ngIf="sesionesFormArray.length > 0">
      <div class="card-header bg-info text-white py-3">
        <h5 class="mb-0 fw-bold">
          <i class="bi bi-calendar-event me-2"></i>Nivel: Configuración de Sesiones
        </h5>
      </div>

      <!-- Contenedor general del listado con scroll -->
      <div
        formArrayName="sesiones"
        style="max-height: 70vh; overflow-y: auto; overflow-x: hidden"
        class="card-body bg-light p-3"
      >
        <!-- Iteración de Tarjetas de Sesión -->
        <div
          *ngFor="let sesion of sesionesFormArray.controls; let i = index"
          [formGroupName]="i"
          class="card mb-4 border border-2 shadow-sm rounded bg-white"
        >
          <!-- CORRECCIÓN RADICAL: Encabezado integrado sin usar card-header rígido para dar aire arriba -->
          <div
            class="w-100 bg-dark-subtle d-flex align-items-center px-3 py-3 border-bottom rounded-top"
          >
            <span class="badge bg-dark me-2 fs-6">Sesión #{{ i + 1 }}</span>
            <strong class="text-dark small text-uppercase tracking-wider"
              >Información y Ubicación del bloque</strong
            >
          </div>

          <!-- Cuerpo del Formulario Siempre visible -->
          <div class="card-body bg-white row g-3 pt-3">
            <!-- 1. Selector de Localidad -->
            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Localidad</label>
              <select
                class="form-select form-select-sm"
                formControlName="localidad"
                (change)="onLocalidadSesionChange(i)"
              >
                <option value="">Seleccione Localidad...</option>
                <!-- CAMBIO: Apunta a getLocalidadesLista() -->
                <option *ngFor="let loc of getLocalidadesLista()" [value]="loc">{{ loc }}</option>
              </select>
            </div>

            <!-- 2. Selector de CDC -->
            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">CDC</label>
              <select
                class="form-select form-select-sm"
                formControlName="cdc"
                (change)="onCdcSesionChange(i)"
              >
                <option value="">Seleccione CDC...</option>
                <option *ngFor="let cdc of cdcsSesionPorIndex[i]" [value]="cdc">{{ cdc }}</option>
              </select>
            </div>

            <!-- 3. Tipo de equipamiento -->
            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Tipo de equipamiento</label>
              <select
                class="form-select form-select-sm"
                formControlName="tipoEquipamiento"
                (change)="onTipoSesionChange(i)"
              >
                <option value="">Seleccione tipo...</option>
                <option *ngFor="let tipo of tiposSesionPorIndex[i]" [value]="tipo">
                  {{ tipo }}
                </option>
              </select>
            </div>

            <!-- 4. Equipamiento enumerado -->
            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Equipamiento enumerado</label>
              <select class="form-select form-select-sm" formControlName="equipamientoEnumerado">
                <option value="">Seleccione código...</option>
                <!-- CAMBIO: Como ahora es un array plano de strings, imprimimos 'cod' directamente -->
                <option *ngFor="let cod of codigosSesionPorIndex[i]" [value]="cod">
                  {{ cod }}
                </option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Fecha de sesión</label>
              <!-- CAMBIO: Añadimos la clase reactiva is-invalid si detecta el error 'fechaFueraDeCurso' -->
              <input
                type="date"
                class="form-control form-control-sm"
                formControlName="fechaSesion"
                [class.is-invalid]="
                  sesion.get('fechaSesion')?.touched &&
                  sesion.get('fechaSesion')?.hasError('fechaFueraDeCurso')
                "
              />

              <!-- ALERTA VISUAL: Se activa al instante si digitan un día inválido -->
              <div
                *ngIf="
                  sesion.get('fechaSesion')?.touched &&
                  sesion.get('fechaSesion')?.hasError('fechaFueraDeCurso')
                "
                class="text-danger small mt-1"
              >
                ⚠️ La fecha debe estar entre el
                {{ cursoForm.get('fechaInicio')?.value | date: 'dd/MM/yyyy' }} y el
                {{ cursoForm.get('fechaFin')?.value | date: 'dd/MM/yyyy' }}.
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Día de semana</label>
              <input
                type="text"
                class="form-control form-control-sm bg-light"
                formControlName="diaSemana"
                readonly
              />
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Hora inicio de uso</label>
              <input
                type="time"
                class="form-control form-control-sm"
                formControlName="horaInicioUso"
              />
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Hora fin de uso</label>
              <input
                type="time"
                class="form-control form-control-sm"
                formControlName="horaFinUso"
              />
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Estado de sesión</label>
              <select class="form-select form-select-sm" formControlName="estadoSesion">
                <option value="Programada">Programada</option>
                <option value="Cancelado">Cancelado</option>
                <option value="No realizado">No realizado</option>
                <option value="Fuera de servicio">Fuera de servicio</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Motivo</label>
              <select class="form-select form-select-sm" formControlName="motivo">
                <option value="">Seleccione motivo...</option>
                <option value="ADECUACION">ADECUACION</option>
                <option value="MANTENIMIENTO">MANTENIMIENTO</option>
                <option value="DOTACION">DOTACION</option>
                <option value="ARCHIVO">ARCHIVO</option>
                <option value="TALENTO HUMANO">TALENTO HUMANO</option>
                <option value="USO BODEGA">USO BODEGA</option>
              </select>
            </div>

            <div class="col-12">
              <label class="form-label small fw-bold text-muted">Observaciones</label>
              <textarea
                class="form-control form-control-sm"
                formControlName="observaciones"
                rows="2"
                placeholder="Novedades de la sesión..."
              ></textarea>
            </div>
          </div>
        </div>
        <!-- Fin de la tarjeta de sesión -->
      </div>
      <!-- Fin del contenedor scroll -->
    </div>
  </div>
</div>
